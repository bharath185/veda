apiVersion: v1
kind: Namespace
metadata:
  name: shopflow
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopflow-api
  namespace: shopflow
  labels:
    app: shopflow-api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: shopflow-api
  template:
    metadata:
      labels:
        app: shopflow-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api
          image: ghcr.io/shopflow/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /ready
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: shopflow-api-service
  namespace: shopflow
spec:
  type: ClusterIP
  ports:
    - port: 4000
      targetPort: 4000
  selector:
    app: shopflow-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopflow-web
  namespace: shopflow
spec:
  replicas: 3
  selector:
    matchLabels:
      app: shopflow-web
  template:
    metadata:
      labels:
        app: shopflow-web
    spec:
      containers:
        - name: web
          image: ghcr.io/shopflow/web:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "800m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: shopflow-web-service
  namespace: shopflow
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: shopflow-web
